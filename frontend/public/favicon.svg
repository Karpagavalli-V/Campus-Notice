<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bgGrad)"/>

  <!-- Subtle inner border -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.2"/>

  <!-- Graduation Cap (Campus) -->
  <g filter="url(#shadow)">
    <!-- Cap Top Diamond Fill & Outline -->
    <polygon points="32,18 51,27 32,36 13,27" fill="rgba(255,255,255,0.22)" stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round"/>
    
    <!-- Cap Base Arc -->
    <path d="M20,30.5 v6.5 c0,6 5.4,10.5 12,10.5 s12,-4.5 12,-10.5 v-6.5" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
    
    <!-- Tassel -->
    <path d="M47,28.5 v11.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="47" cy="41" r="1.8" fill="#ffffff"/>
  </g>

  <!-- Notice / Alert Beacon Badge (Top Right) -->
  <circle cx="48" cy="16" r="6" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="1.8"/>
  <circle cx="48" cy="16" r="2.2" fill="#ffffff"/>
</svg>